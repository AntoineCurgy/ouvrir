<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Essai 3 : app Mail</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 16px; background: Canvas; color: CanvasText; }
  a, button { display: block; width: 100%; box-sizing: border-box; margin: 14px 0; padding: 14px; border-radius: 12px; border: 0; text-align: left; text-decoration: none; background: #1a73e8; color: #fff; font: 600 16px -apple-system, system-ui, sans-serif; }
  small { display: block; opacity: .7; font-weight: 400; margin-top: 4px; word-break: break-all; }
</style>
</head>
<body>
<p>Essai de l'app Mail d'Apple sur le dernier courriel Mecaza. Il faut que votre compte Gmail soit ajouté dans l'app Mail. Appuyez sur chaque bouton, revenez ici entre deux.</p>
<div id="liste"></div>
<script>
  // AUT_ANT_01 : deuxieme essai des liens de l'application Gmail sur iOS (2026-09-30).
  // Pistes tirees d'une recherche en ligne : cv= sur un fil a plusieurs messages
  // (identifiant du fil different de celui du message), formes decimales, et le
  // montage atteste : copier une recherche rfc822msgid puis ouvrir Gmail.
  var q = new URLSearchParams(location.search);
  var t = (q.get('t') || '').replace(/[^0-9a-fA-F]/g, '');
  var m = (q.get('m') || '').replace(/[^0-9a-fA-F]/g, '');
  var id = q.get('id') || '';
  var dec = t ? BigInt('0x' + t).toString() : '';
  var enc = encodeURIComponent('<' + id + '>');
  var formes = [
    ['1', 'message://' + enc, 'app Mail, identifiant entre chevrons'],
    ['2', 'message:' + enc, 'app Mail, sans les deux barres'],
    ['3', 'message://' + encodeURIComponent(id), 'app Mail, sans chevrons']
  ];
  var liste = document.getElementById('liste');
  formes.forEach(function (f) {
    var a = document.createElement('a');
    a.href = f[1];
    a.innerHTML = 'Essai ' + f[0] + ' — ' + f[2] + '<small>' + f[1] + '</small>';
    liste.appendChild(a);
  });
</script>
</body>
</html>
