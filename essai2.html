<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Essai 2 des liens Gmail</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 16px; background: Canvas; color: CanvasText; }
  a, button { display: block; width: 100%; box-sizing: border-box; margin: 14px 0; padding: 14px; border-radius: 12px; border: 0; text-align: left; text-decoration: none; background: #1a73e8; color: #fff; font: 600 16px -apple-system, system-ui, sans-serif; }
  small { display: block; opacity: .7; font-weight: 400; margin-top: 4px; word-break: break-all; }
</style>
</head>
<body>
<p>Essai sur un fil de quatre messages (Mecaza). Appuyez sur chaque bouton, revenez ici entre deux, et notez ce qui s'ouvre.</p>
<div id="liste"></div>
<script>
  // AUT_ANT_01 : deuxieme essai des liens de l'application Gmail sur iOS (2026-09-30).
  // Pistes tirees d'une recherche en ligne : cv= sur un fil a plusieurs messages
  // (identifiant du fil different de celui du message), formes decimales, et le
  // montage atteste : copier une recherche rfc822msgid puis ouvrir Gmail.
  var q = new URLSearchParams(location.search);
  var t = (q.get('t') || '').replace(/[^0-9a-fA-F]/g, '');
  var m = (q.get('m') || '').replace(/[^0-9a-fA-F]/g, '');
  var id = q.get('id') || '';
  var dec = t ? BigInt('0x' + t).toString() : '';
  var formes = [
    ['1', 'googlegmail:///cv=' + t, 'identifiant du fil, hexadécimal'],
    ['2', 'googlegmail:///cv=' + dec, 'identifiant du fil, décimal'],
    ['3', 'googlegmail:///cv=%23thread-f%3A' + dec, 'thread-f, décimal'],
    ['4', 'googlegmail:///cv=' + m, 'identifiant du dernier message, hexadécimal']
  ];
  var liste = document.getElementById('liste');
  formes.forEach(function (f) {
    var a = document.createElement('a');
    a.href = f[1];
    a.innerHTML = 'Essai ' + f[0] + ' — ' + f[2] + '<small>' + f[1] + '</small>';
    liste.appendChild(a);
  });
  var b = document.createElement('button');
  var recherche = 'rfc822msgid:' + id;
  b.innerHTML = 'Essai 5 — copie la recherche, puis ouvre Gmail<small>dans Gmail : touchez la recherche, collez, validez</small>';
  b.onclick = function () {
    try { navigator.clipboard.writeText(recherche); } catch (e) {}
    location.href = 'googlegmail://';
  };
  liste.appendChild(b);
</script>
</body>
</html>
