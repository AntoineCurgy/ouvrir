<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ouvrir le courriel</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 32px 16px; text-align: center; background: Canvas; color: CanvasText; }
  a { display: block; margin: 16px auto; max-width: 320px; padding: 14px; border-radius: 12px; text-decoration: none; background: #1a73e8; color: #fff; font-weight: 600; }
  a.second { background: transparent; color: #1a73e8; border: 1px solid #1a73e8; }
  p { opacity: .7; }
</style>
</head>
<body>
<p id="etat">Ouverture du courriel…</p>
<a id="mail" href="#">Ouvrir dans Mail</a>
<a id="gmail" class="second" href="googlegmail://">Ouvrir Gmail (boîte de réception)</a>
<script>
  // AUT_ANT_01 : rebond d'un signal Telegram vers le courriel lui-meme.
  // Telegram n'accepte que des liens https. Mesure du 2026-09-30 sur l'iPhone
  // d'Antoine : l'app Gmail ne sait ouvrir aucun courriel precis (dix formes
  // essayees) ; l'app Mail d'Apple l'ouvre par message://<Message-ID>, a condition
  // que le compte y soit ajoute et le courriel telecharge. Rien n'est stocke :
  // l'identifiant passe dans l'adresse.
  var q = new URLSearchParams(location.search);
  var m = q.get('m') || '';
  if (m) {
    var cible = 'message://' + encodeURIComponent('<' + m.replace(/^<|>$/g, '') + '>');
    document.getElementById('mail').href = cible;
    location.href = cible;
  } else {
    document.getElementById('mail').style.display = 'none';
    location.href = 'googlegmail://';
  }
  setTimeout(function () {
    if (!document.hidden) {
      document.getElementById('etat').textContent = "Le courriel ne s'est pas ouvert : choisissez ci-dessous.";
    }
  }, 1500);
</script>
</body>
</html>
